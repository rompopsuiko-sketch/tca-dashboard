<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0D1117; color: #E6EDF3; font-family: system-ui, sans-serif; padding: 24px; }
  h1 { font-size: 28px; color: #fff; margin-bottom: 4px; }

  .filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #30363D; background: #161B22; color: #fff; cursor: pointer; font-size: 14px; }
  .btn.active { background: #238636; border-color: #238636; }

  .stat-label { font-size: 12px; color: #8B949E; margin-top: 4px; }
  .table-wrap { border-radius: 12px; border: 1px solid #30363D; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: #161B22; }
  th { padding: 12px 16px; text-align: left; color: #8B949E; font-size: 13px; border-bottom: 1px solid #30363D; }
  tr:nth-child(even) { background: #1C2128; }
  tr:nth-child(odd) { background: #161B22; }
  td { padding: 12px 16px; font-size: 14px; }
  .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
  .badge-dhl { background: #0F2D16; color: #3FB950; }
  .badge-ogolna { background: #1A1A2E; color: #79C0FF; }
  .status-active { color: #3FB950; font-weight: bold; }

  select, input[type="date"], input[type="text"] {

    background: #161B22; color: #E6EDF3; font-size: 14px;

  .rp-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .rp-row:last-child { margin-bottom: 0; }
  .rp-label { color: #8B949E; font-size: 13px; min-width: 100px; }
  .m-info { color: #8B949E; font-size: 13px; margin-bottom: 16px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .m-card { background: #161B22; border: 1px solid #30363D; border-radius: 10px; overflow: hidden; }
  .m-card img { width: 100%; height: 140px; object-fit: cover; display: block; background: #0D1117; }
  .m-meta { padding: 8px 10px; font-size: 12px; color: #8B949E; line-height: 1.5; }
  .m-meta b { color: #E6EDF3; display: block; word-break: break-all; }

  let allData = [];
let currentFilter = 'all';
let mediaObjects = null;   // null = zakładka Media jeszcze nie wczytana
let mediaLoading = false;

async function loadData() {
  const { data, error } = await db
    .from('shifts')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) { console.error(error); return; }

    'Ostatnia aktualizacja: ' + new Date().toLocaleTimeString('pl-PL') + ' · Auto-odświeżanie co 30s';
}

function getLatestPerDriver(data) {
  const map = {};
  data.forEach(s => {
    if (!map[s.driver_name]) map[s.driver_name] = s;
  });
  return Object.values(map);
}

function getStatus(shift) {
  if (shift.status === 'finished') {
    if (shift.pause_end) {
      const end = new Date(shift.pause_end);
      if (end > new Date()) {
        const t = end.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
        return { text: '🟡 Przerwa do ' + t, cls: 'status-pause' };
      }
    }
    return { text: '🔴 Nieaktywny', cls: 'status-inactive' };
  }
  if (shift.current_activity === 'ZAŁADUNEK') {
    return { text: '📦 Załadunek', cls: 'status-loading' };
  }
  if (shift.current_activity === 'ROZŁADUNEK') {
    return { text: '📤 Rozładunek', cls: 'status-loading' };
  }
  return { text: '🟢 W trasie', cls: 'status-active' };
}

function calcPauseUsage(driverName) {
  const driverShifts = allData
    .filter(s => s.driver_name === driverName && s.start_time)
    .sort((a, b) => new Date(a.start_time) - new Date(b.start_time));

  let used = 0;
  for (let i = 0; i < driverShifts.length; i++) {
    const shift = driverShifts[i];
    if (i > 0 && driverShifts[i - 1].end_time) {
      const restH = (new Date(shift.start_time) - new Date(driverShifts[i - 1].end_time)) / 3600000;
      if (restH >= 24) {
        used = 0;
      } else if (restH < 11) {
        used++;
      }
    }
    if (shift.end_time) {
      const durationH = (new Date(shift.end_time) - new Date(shift.start_time)) / 3600000;
      if (durationH > 13) used++;
    }
  }
  return used;
}

function getTimerInfo(shift) {
  if (shift.status === 'active' && shift.start_time) {
    return { mode: 'elapsed', ref: shift.start_time };
  }
  if (shift.status === 'finished' && shift.end_time) {
    return { mode: 'pause', ref: shift.end_time, target: shift.pause_end };
  }
  return null;
}

function formatDuration(ms) {
  if (ms < 0) ms = 0;
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${h}h ${m}m`;
}

function renderTable() {
  const latestAll = getLatestPerDriver(allData);

  let drivers = latestAll;
  if (currentFilter === 'active') drivers = drivers.filter(s => s.status === 'active');
  if (currentFilter === 'dhl') drivers = drivers.filter(s => s.group_type === 'DHL');
  if (currentFilter === 'ogolna') drivers = drivers.filter(s => s.group_type === 'Ogólna');

  document.getElementById('total').textContent = drivers.length;
  document.getElementById('active').textContent = drivers.filter(d => d.status === 'active').length;
  document.getElementById('onbreak').textContent = drivers.filter(d => d.status === 'finished').length;

  const tbody = document.getElementById('tbody');
  if (drivers.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11" class="loading">Brak danych</td></tr>';
    return;
  }

  tbody.innerHTML = drivers.map(s => {
    const status = getStatus(s);
    const km = (s.start_km && s.end_km) ? (s.end_km - s.start_km) + ' km' : '—';
    const opts = { hour: '2-digit', minute: '2-digit' };
    const startTime = s.start_time
      ? new Date(s.start_time).toLocaleTimeString('pl-PL', opts)
      : new Date(s.created_at).toLocaleTimeString('pl-PL', opts);
    const endTime = s.end_time
      ? new Date(s.end_time).toLocaleTimeString('pl-PL', opts)
      : '—';
    const badgeCls = s.group_type === 'DHL' ? 'badge-dhl' : 'badge-ogolna';
    const shortPauses = calcPauseUsage(s.driver_name);
    const pauseCls = shortPauses > 3 ? 'style="color:#d32f2f;font-weight:bold"' : '';

    const timerInfo = getTimerInfo(s);
    const timerAttr = timerInfo
      ? `data-timer-ref="${timerInfo.ref}" data-timer-mode="${timerInfo.mode}" ${timerInfo.target ? `data-timer-target="${timerInfo.target}"` : ''}`
      : '';

    return `<tr>
      <td>${s.driver_name}</td>
      <td>${s.truck}</td>
      <td><span class="badge ${badgeCls}">${s.group_type}</span></td>
      <td class="${status.cls}">${status.text}</td>
      <td>${startTime}</td>
      <td>${endTime}</td>
      <td>${s.start_city || '—'}</td>
      <td>${s.end_city || '—'}</td>
      <td>${km}</td>
      <td ${pauseCls}>${shortPauses}/3</td>
      <td class="timer-cell" ${timerAttr}>—</td>
    </tr>`;
  }).join('');

  updateTimers();
}

function updateTimers() {
  document.querySelectorAll('.timer-cell[data-timer-ref]').forEach(cell => {
    const ref = new Date(cell.getAttribute('data-timer-ref'));
    const mode = cell.getAttribute('data-timer-mode');
    const now = new Date();

    if (mode === 'elapsed') {
      cell.textContent = 'Jedzie: ' + formatDuration(now - ref);
    } else if (mode === 'pause') {
      const target = cell.getAttribute('data-timer-target');
      const stoodFor = formatDuration(now - ref);
      if (target) {
        const remain = new Date(target) - now;
        cell.textContent = remain > 0
          ? `Stoi: ${stoodFor} (jeszcze ~${formatDuration(remain)})`
          : `Stoi: ${stoodFor} (min. czas osiągnięty)`;
      } else {
        cell.textContent = `Stoi: ${stoodFor}`;
      }
    }
  });
}

setInterval(updateTimers, 60000);
loadData();

  /* ===================== RAPORTY PDF ===================== */

let reportType = 'work';

// Панель відкривається кнопкою "Pobierz PDF". При першому відкритті
// період одразу виставляється на поточний місяць.
function toggleReportPanel(show) {
  const panel = document.getElementById('report-panel');
  const open = (show === undefined) ? panel.hidden : show;
  panel.hidden = !open;
  if (!open) return;
  fillReportDrivers();
  if (!document.getElementById('rp-from').value) setPeriodPreset('current');
}

function setReportType(type) {
  reportType = type;
  document.getElementById('rt-work').classList.toggle('active', type === 'work');
  document.getElementById('rt-fuel').classList.toggle('active', type === 'fuel');
}

// Список водіїв беремо з уже завантажених змін.
// Вибір зберігаємо — інакше авто-оновлення раз на 30с скидало б його.
function fillReportDrivers() {
  const sel = document.getElementById('rp-driver');
  const prev = sel.value;
  const names = [...new Set(allData.map(s => s.driver_name).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">— wybierz kierowcę —</option>' +
    names.map(n => `<option value="${n}">${n}</option>`).join('');
  if (names.includes(prev)) sel.value = prev;
}

// YYYY-MM-DD у локальному часі. Через toISOString не можна —
// він переводить у UTC і на початку/кінці місяця з'їдає день.
function fmtDateInput(d) {
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

function setPeriodPreset(preset) {
  const now = new Date();
  let from, to;
  if (preset === 'current') {
    from = new Date(now.getFullYear(), now.getMonth(), 1);
    to = now;
  } else {
    from = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    to = new Date(now.getFullYear(), now.getMonth(), 0); // день 0 = останній день попереднього місяця
  }
  document.getElementById('rp-from').value = fmtDateInput(from);
  document.getElementById('rp-to').value = fmtDateInput(to);
  document.getElementById('rp-cur').classList.toggle('active', preset === 'current');
  document.getElementById('rp-prev').classList.toggle('active', preset === 'prev');
}

// Дати правили руками — жоден пресет більше не підсвічений
function onPeriodEdit() {
  document.getElementById('rp-cur').classList.remove('active');
  document.getElementById('rp-prev').classList.remove('active');
}

function getReportRange() {
  const fromV = document.getElementById('rp-from').value;
  const toV = document.getElementById('rp-to').value;
  if (!fromV || !toV) { alert('Wybierz okres (od / do).'); return null; }
  const from = new Date(fromV + 'T00:00:00');
  const to = new Date(toV + 'T23:59:59.999');
  if (from > to) { alert('Data "od" jest późniejsza niż data "do".'); return null; }
  return {
    fromISO: from.toISOString(),
    toISO: to.toISOString(),
    label: from.toLocaleDateString('pl-PL') + ' – ' + to.toLocaleDateString('pl-PL')
  };
}

function runReport() {
  const driver = document.getElementById('rp-driver').value;
  if (!driver) { alert('Wybierz kierowcę.'); return; }
  const range = getReportRange();
  if (!range) return;
  if (reportType === 'work') generateWorkPDF(driver, range);
  else generateFuelPDF(driver, range);
}

function openPrintWindow(html) {
  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
}

async function generateWorkPDF(name, range) {
  const { data: shifts } = await db
    .from('shifts')
    .select('*')
    .eq('driver_name', name)
    .gte('created_at', range.fromISO)
    .lte('created_at', range.toISO)
    .order('created_at', { ascending: true });

  if (!shifts || shifts.length === 0) {
    alert('Brak danych dla: ' + name + '\nOkres: ' + range.label);
    return;
  }

  // Заправки тягнемо по id змін, а не по імені — тоді рядки ⛽ завжди
  // відповідають саме тим змінам, які потрапили у звіт.
  const { data: fuels } = await db
    .from('fuels')
    .select('*')
    .in('shift_id', shifts.map(s => s.id))
    .order('created_at', { ascending: true });

  const trucksUsed = [...new Set(shifts.map(s => s.truck).filter(Boolean))];
  const truckLabel = trucksUsed.join(', ');

  // палітра пастельних кольорів під кожну машину
  const palette = ['#e3f2fd', '#f1f8e9', '#fff3e0', '#f3e5f5', '#e0f2f1', '#fce4ec'];
  const truckColor = {};
  trucksUsed.forEach((t, i) => truckColor[t] = palette[i % palette.length]);

  // групуємо зміни по truck, зберігаючи хронологію всередині групи
  const groups = {};
  shifts.forEach(s => {
    const key = s.truck || 'Bez auta';
    if (!groups[key]) groups[key] = [];
    groups[key].push(s);
  });

  let blocksHtml = '';
  let grandKm = 0;
  let grandLiters = 0;

  Object.keys(groups).forEach(truck => {
    const truckShifts = groups[truck];
    const bg = truckColor[truck] || '#f5f5f5';
    let truckKm = 0;
    let truckLiters = 0;
    let rows = '';

    truckShifts.forEach(s => {
      const date = new Date(s.created_at).toLocaleDateString('pl-PL');
      const startTime = s.start_time
        ? new Date(s.start_time).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' })
        : '—';
      const endTime = s.end_time
        ? new Date(s.end_time).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' })
        : '—';
      const km = (s.start_km && s.end_km) ? s.end_km - s.start_km : 0;
      truckKm += km;

      rows += `<tr style="background:${bg}">
        <td>${date}</td>
        <td>${s.start_city || '—'}</td>
        <td>${s.end_city || '—'}</td>
        <td>${startTime}</td>
        <td>${s.start_km || '—'}</td>
        <td>${endTime}</td>
        <td>${s.end_km || '—'}</td>
        <td>${km || '—'}</td>
      </tr>`;

      const shiftFuels = (fuels || []).filter(f => f.shift_id === s.id);
      shiftFuels.forEach(f => {
        truckLiters += parseFloat(f.liters) || 0;
        rows += `<tr style="background:${bg}; font-style:italic;">
          <td>${date}</td>
          <td colspan="3" style="color:#e65100; font-weight:bold">⛽ TANKOWANIE</td>
          <td>${f.km} km</td>
          <td>—</td>
          <td>${f.liters} L</td>
          <td>—</td>
        </tr>`;
      });
    });

    grandKm += truckKm;
    grandLiters += truckLiters;

    blocksHtml += `
      <tr><td colspan="8" style="background:${bg}; font-weight:bold; padding:8px; border-top:2px solid #263238;">
        🚛 ${truck}
      </td></tr>
      ${rows}
      <tr style="background:${bg}; font-weight:bold;">
        <td colspan="7" style="text-align:right">Razem dla ${truck}:</td>
        <td>${truckKm} km / ${truckLiters.toFixed(1)}L</td>
      </tr>`;
  });

  const html = `<!DOCTYPE html>
  <html><head>
  <meta charset="UTF-8">
  <title>Karta pracy - ${name}</title>
  <style>
    body { font-family: Arial, sans-serif; font-size: 11px; padding: 20px; }
    h2 { text-align: center; margin-bottom: 4px; }
    .info { text-align: center; margin-bottom: 16px; color: #555; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #263238; color: #fff; padding: 6px 8px; text-align: left; }
    td { padding: 5px 8px; border-bottom: 1px solid #ddd; }

  </style>
  </head><body>

  <th>Data</th><th>Skąd</th><th>Dokąd</th>
  <th>Godz. wyjazdu</th><th>Stan km przed</th>
  <th>Godz. przyjazdu</th><th>Stan km po</th>

</tr></thead>
    <tbody>

// Окремий звіт тільки по заправках: скільки, коли, на якому авто
// і середнє спалювання між заправками.
async function generateFuelPDF(name, range) {
  const { data: fuels } = await db
    .from('fuels')
    .select('*')
    .eq('driver_name', name)
    .gte('created_at', range.fromISO)
    .lte('created_at', range.toISO)
    .order('created_at', { ascending: true });

  if (!fuels || fuels.length === 0) {
    alert('Brak tankowań dla: ' + name + '\nOkres: ' + range.label);
    return;
  }

  // У таблиці fuels немає авта — беремо його зі зміни, до якої прив'язана заправка
  const shiftIds = [...new Set(fuels.map(f => f.shift_id).filter(Boolean))];
  const truckById = {};
  if (shiftIds.length) {
    const { data: shifts } = await db.from('shifts').select('id, truck').in('id', shiftIds);
    (shifts || []).forEach(s => { truckById[s.id] = s.truck; });
  }

  // Групуємо по авто — лічильник км у кожної машини свій
  const groups = {};
  fuels.forEach(f => {
    const truck = truckById[f.shift_id] || 'Bez auta';
    if (!groups[truck]) groups[truck] = [];
    groups[truck].push(f);
  });

  const palette = ['#e3f2fd', '#f1f8e9', '#fff3e0', '#f3e5f5', '#e0f2f1', '#fce4ec'];
  let blocksHtml = '';
  let grandLiters = 0;
  let grandSpanKm = 0;
  let grandLitersAfterFirst = 0;

  Object.keys(groups).forEach((truck, gi) => {
    const list = groups[truck];
    const bg = palette[gi % palette.length];
    let rows = '';
    let truckLiters = 0;
    let litersAfterFirst = 0;
    let prevKm = null;

    list.forEach((f, i) => {
      const liters = parseFloat(f.liters) || 0;
      const km = parseInt(f.km) || 0;
      truckLiters += liters;

      // Скільки проїхано від попередньої заправки цього авта
      const diff = (prevKm !== null && km > prevKm) ? km - prevKm : null;
      // Спалювання "від повного до повного": літри цієї заправки на пройдений відтинок
      const l100 = (diff && diff > 0) ? (liters / diff * 100) : null;
      if (i > 0) litersAfterFirst += liters;

      const d = new Date(f.created_at);
      rows += `<tr style="background:${bg}">
        <td>${d.toLocaleDateString('pl-PL')}</td>
        <td>${d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' })}</td>
        <td>${km ? km + ' km' : '—'}</td>
        <td><b>${liters.toFixed(1)} L</b></td>
        <td>${diff ? diff + ' km' : '—'}</td>
        <td>${l100 ? l100.toFixed(1) + ' L/100km' : '—'}</td>
      </tr>`;

      prevKm = km || prevKm;
    });

    // Середнє по авто: літри без першої заправки / відстань між першою і останньою
    const firstKm = parseInt(list[0].km) || 0;
    const lastKm = parseInt(list[list.length - 1].km) || 0;
    const spanKm = (lastKm > firstKm) ? lastKm - firstKm : 0;
    const avg = spanKm > 0 ? (litersAfterFirst / spanKm * 100) : null;

    grandLiters += truckLiters;
    grandSpanKm += spanKm;
    grandLitersAfterFirst += litersAfterFirst;

    blocksHtml += `
      <tr><td colspan="6" style="background:${bg}; font-weight:bold; padding:8px; border-top:2px solid #263238;">
        🚛 ${truck} — tankowań: ${list.length}
      </td></tr>
      ${rows}
      <tr style="background:${bg}; font-weight:bold;">
        <td colspan="3" style="text-align:right">Razem dla ${truck}:</td>
        <td>${truckLiters.toFixed(1)} L</td>
        <td>${spanKm || '—'} km</td>
        <td>${avg ? avg.toFixed(1) + ' L/100km' : '—'}</td>
      </tr>`;
  });

  const grandAvg = grandSpanKm > 0 ? (grandLitersAfterFirst / grandSpanKm * 100) : null;

  const html = `<!DOCTYPE html>
  <html><head>
  <meta charset="UTF-8">
  <title>Raport tankowania - ${name}</title>
  <style>
    body { font-family: Arial, sans-serif; font-size: 11px; padding: 20px; }
    h2 { text-align: center; margin-bottom: 4px; }
    .info { text-align: center; margin-bottom: 16px; color: #555; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #263238; color: #fff; padding: 6px 8px; text-align: left; }
    td { padding: 5px 8px; border-bottom: 1px solid #ddd; }
    .grand-total { font-weight: bold; background: #e8f5e9 !important; }
    .note { margin-top: 14px; color: #777; font-size: 10px; }
  </style>
  </head><body>
  <h2>TCA — Raport tankowania</h2>
  <p class="info">Kierowca: <b>${name}</b> | Okres: <b>${range.label}</b> | Tankowań: <b>${fuels.length}</b></p>
  <table>
    <thead><tr>
      <th>Data</th><th>Godzina</th><th>Stan licznika</th>
      <th>Zatankowano</th><th>Od ost. tankowania</th><th>Spalanie</th>
    </tr></thead>
    <tbody>
      ${blocksHtml}
      <tr class="grand-total">
        <td colspan="3" style="text-align:right">RAZEM (wszystkie auta):</td>
        <td>${grandLiters.toFixed(1)} L</td>
        <td>${grandSpanKm || '—'} km</td>
        <td>${grandAvg ? grandAvg.toFixed(1) + ' L/100km' : '—'}</td>
      </tr>
    </tbody>
  </table>
  <p class="note">
    Spalanie liczone metodą „od pełna do pełna": litry danego tankowania dzielone przez dystans
    przejechany od poprzedniego tankowania tego auta. Przy pierwszym tankowaniu w okresie nie ma
    punktu odniesienia, dlatego w kolumnie jest „—".
  </p>
  <script>window.print();<\/script>
  </body></html>`;

  openPrintWindow(html);
}

/* ===================== MEDIA (zdjęcia CMR) ===================== */

const MEDIA_BUCKET = 'cmr-photos';

function setView(v) {
  document.getElementById('view-drivers').hidden = v !== 'drivers';
  document.getElementById('view-media').hidden = v !== 'media';
  document.getElementById('nav-drivers').classList.toggle('active', v === 'drivers');
  document.getElementById('nav-media').classList.toggle('active', v === 'media');
  if (v === 'media' && mediaObjects === null) loadMedia();
}

// cmr_{kierowca}_{trasa}_{timestamp}_{index}.jpg
function parseCmrName(name) {
  const base = name.replace(/\.[^.]+$/, '');
  const parts = base.split('_');
  let driver = '?', tour = '?', ts = null, idx = '0';
  if (parts.length >= 5 && parts[0] === 'cmr') {
    idx = parts[parts.length - 1];
    ts = parts[parts.length - 2];
    tour = parts[parts.length - 3];
    driver = parts.slice(1, parts.length - 3).join('_');
  }
  const date = (ts && /^\d{10,13}$/.test(ts)) ? new Date(Number(ts)) : null;
  return { driver, tour, idx, date };
}

async function loadMedia(force) {
  if (mediaLoading) return;
  mediaLoading = true;
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '<div class="loading">Ładowanie zdjęć…</div>';

  const all = [];
  const pageSize = 100;
  let offset = 0;
  try {
    while (true) {
      const { data, error } = await db.storage.from(MEDIA_BUCKET).list('', {
        limit: pageSize,
        offset,
        sortBy: { column: 'created_at', order: 'desc' },
      });
      if (error) throw error;
      if (!data || data.length === 0) break;

      for (const o of data) {
        if (o.id === null) continue;                       // placeholder folderu
        if (!/\.(jpe?g|png|webp)$/i.test(o.name)) continue;
        const m = parseCmrName(o.name);
        const created = o.created_at ? new Date(o.created_at) : null;
        all.push({
          name: o.name,
          url: db.storage.from(MEDIA_BUCKET).getPublicUrl(o.name).data.publicUrl,
          size: (o.metadata && o.metadata.size) || 0,
          driver: m.driver,
          tour: m.tour,
          idx: m.idx,
          date: m.date || created,
        });
      }
      if (data.length < pageSize) break;
      offset += pageSize;
    }

    mediaObjects = all;
    buildMediaDriverOptions();
    renderMedia();
  } catch (e) {
    console.error(e);
    gallery.innerHTML = '<div class="loading">Błąd ładowania: ' + (e.message || e) + '</div>';
  } finally {
    mediaLoading = false;
  }
}

function buildMediaDriverOptions() {
  const sel = document.getElementById('m-driver');
  if (!sel) return;
  const names = new Set();
  (mediaObjects || []).forEach(o => { if (o.driver && o.driver !== '?') names.add(o.driver.trim()); });
  (allData || []).forEach(s => { if (s.driver_name) names.add(s.driver_name.trim()); });
  const cur = sel.value;
  sel.innerHTML = '<option value="">Wszyscy kierowcy</option>' +
    [...names].filter(Boolean).sort().map(n => {
      const v = n.replace(/"/g, '&quot;');
      return `<option value="${v}">${n}</option>`;
    }).join('');
  sel.value = cur;
}

function getMediaFiltered() {
  const driver = document.getElementById('m-driver').value.trim().toLowerCase();
  const tour = document.getElementById('m-tour').value.trim().toLowerCase();
  const fromV = document.getElementById('m-from').value;
  const toV = document.getElementById('m-to').value;
  const from = fromV ? new Date(fromV + 'T00:00:00') : null;
  const to = toV ? new Date(toV + 'T23:59:59.999') : null;

  return (mediaObjects || []).filter(o => {
    if (driver && o.driver.trim().toLowerCase() !== driver) return false;
    if (tour && !o.tour.toLowerCase().includes(tour)) return false;
    if (from && (!o.date || o.date < from)) return false;
    if (to && (!o.date || o.date > to)) return false;
    return true;
  });
}

function renderMedia() {
  if (mediaObjects === null) return;
  const list = getMediaFiltered();
  const totalBytes = list.reduce((s, o) => s + (o.size || 0), 0);
  const suffix = list.length !== mediaObjects.length ? ` (z ${mediaObjects.length} łącznie)` : '';
  document.getElementById('m-info').textContent =
    `Znaleziono: ${list.length} zdjęć · ~${(totalBytes / 1048576).toFixed(1)} MB` + suffix;

  const gallery = document.getElementById('gallery');
  if (list.length === 0) {
    gallery.innerHTML = '<div class="loading">Brak zdjęć dla wybranych filtrów</div>';
    return;
  }
  gallery.innerHTML = list.map(o => {
    const d = o.date ? o.date.toLocaleDateString('pl-PL') : '—';
    return `<div class="m-card">
      <a href="${o.url}" target="_blank" rel="noopener">
        <img loading="lazy" src="${o.url}" alt="${o.name}">
      </a>
      <div class="m-meta">
        <b>${o.driver.trim() || '?'}</b>
        Trasa: ${o.tour}<br>${d}
      </div>
    </div>`;
  }).join('');
}

function sanitizeSeg(s) {
  return String(s || '').replace(/[\/\\:*?"<>|]/g, '_').trim() || '_';
}

async function downloadMediaZip() {
  if (typeof JSZip === 'undefined') { alert('JSZip nie został załadowany.'); return; }
  const list = getMediaFiltered();
  if (list.length === 0) { alert('Brak zdjęć do pobrania.'); return; }

  const btn = document.getElementById('m-zip');
  const orig = btn.textContent;
  btn.disabled = true;

  const zip = new JSZip();
  const used = new Set();
  let ok = 0, fail = 0;

  for (let i = 0; i < list.length; i++) {
    const o = list[i];
    btn.textContent = `Pobieranie ${i + 1}/${list.length}…`;
    try {
      const resp = await fetch(o.url);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const blob = await resp.blob();
      const folder = (o.tour && o.tour !== '?') ? sanitizeSeg(o.tour) : 'bez_trasy';
      const driver = sanitizeSeg(o.driver) || 'kierowca';
      let path = `${folder}/${driver}_${o.idx}.jpg`;
      let n = 2;
      while (used.has(path)) path = `${folder}/${driver}_${o.idx}_${n++}.jpg`;
      used.add(path);
      zip.file(path, blob);
      ok++;
    } catch (e) {
      console.error('ZIP fail:', o.name, e);
      fail++;
    }
  }

  const content = await zip.generateAsync({ type: 'blob' }, m => {
    btn.textContent = `Pakowanie ${Math.round(m.percent)}%…`;
  });

  const stamp = new Date().toISOString().slice(0, 10);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(content);
  a.download = `cmr_photos_${stamp}.zip`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);

  btn.disabled = false;
  btn.textContent = orig;
  if (fail) alert(`Gotowe: dodano ${ok}, błędów: ${fail}.`);
}
